name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to create the release under (e.g. v0.1.0)"
        required: true
        default: "v0.1.0"

permissions:
  contents: write

jobs:
  release:
    name: Build and publish debug-signed release APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"

      - name: Assemble release APK
        run: gradle --no-daemon assembleRelease

      - name: Verify the APK is signed
        run: |
          BUILD_TOOLS="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)"
          "$BUILD_TOOLS/apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk

      - name: Report what R8 removed and renamed
        shell: bash
        run: |
          bash .github/scripts/optimization-report.sh \
            app/build/outputs/mapping/release \
            app/build/outputs/apk/release/app-release.apk >> "$GITHUB_STEP_SUMMARY"

      # The mapping ships with the release, not just as a build artifact that expires: a crash
      # report from a published APK is undecipherable without the exact mapping.txt of the build
      # that produced it, and that file cannot be reconstructed afterwards.
      - name: Name the mapping after its tag
        shell: bash
        run: |
          cp app/build/outputs/mapping/release/mapping.txt \
            "app/build/outputs/mapping/release/mapping-${{ inputs.tag || github.ref_name }}.txt"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/mapping/release/mapping-*.txt
          generate_release_notes: true
